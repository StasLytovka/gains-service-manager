server {
    listen 80;
    server_name multitenantpoc.gainsystems.com;

    # Redirect HTTP → HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    root /opt/gains-service-manager/frontend/dist/gains-service-manager-ui/browser;
    index index.html;

    # Angular SPA — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api → Spring Boot backend
    location /api/ {
        proxy_pass         http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Logs
    access_log /var/log/nginx/gains-manager-access.log;
    error_log  /var/log/nginx/gains-manager-error.log;
}

