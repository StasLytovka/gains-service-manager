# This config is NOT a separate nginx site.
# The /svcmgr/ location is added inside the existing multitenantpoc site:
#   /etc/nginx/sites-available/multitenantpoc
#
# Add these two blocks BEFORE the existing "location /" block:

# Angular SPA
location /svcmgr/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /svcmgr/index.html;
}

# Spring Boot API
location /svcmgr-api/ {
    proxy_pass         http://127.0.0.1:8090/api/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Symlink setup (run once):
# sudo ln -sfn /opt/gains-service-manager/frontend/dist/gains-service-manager-ui/browser \
#              /var/www/svcmgr
