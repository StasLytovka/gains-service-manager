    <h2 class="sign-in-title">Sign in</h2>
    <p class="sign-in-subtitle">Service Manager</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field-group">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" formControlName="username"
               placeholder="username" autocomplete="username">
      </div>

      <div class="field-group">
        <label for="login-password">Password</label>
        <div class="password-input-wrap">
          <input id="login-password" formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'"
                 placeholder="password" autocomplete="current-password">
          <button type="button" class="pwd-toggle" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="error-msg" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading || form.invalid"
              [class.is-loading]="loading">
        <span *ngIf="!loading">Sign In</span>
        <span class="spinner" *ngIf="loading"></span>
      </button>
    </form>

    <hr class="divider">

    <div class="card-footer">
      <button type="button" class="theme-link" (click)="theme.toggle()">
        <mat-icon>{{ theme.isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </div>
</div>
